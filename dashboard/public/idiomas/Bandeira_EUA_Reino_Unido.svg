<?xml version="1.0" encoding="UTF-8"?>
<!--
  Bandeira mesclada de Estados Unidos e Reino Unido, marca do inglês no seletor
  de idioma. Não existe bandeira da língua inglesa; a divisão em diagonal é a
  convenção dos seletores de idioma para esse caso.

  Cada metade traz a bandeira oficial (Wikimedia Commons, "Flag of the United
  States.svg" e "Flag of the United Kingdom.svg", domínio público) sem
  deformar: as duas cobrem o quadro na própria proporção e a diagonal recorta.
  Os EUA ficam à esquerda, presos ao canto, para o cantão azul não ser cortado;
  o centro da Union Jack fica no meio da metade direita.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 60 40" role="img">
